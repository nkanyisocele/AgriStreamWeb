name: CLDV7112 CI/CD Cloud Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Project Dependencies
      run: dotnet restore AgriStreamWeb.sln

    - name: Build Application
      run: dotnet build AgriStreamWeb.sln --no-restore -c Release

    - name: Run Automation Tests
      run: dotnet test AgriStreamWeb.sln --no-build --verbosity normal

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: Build and Tag Container Image
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_SERVER }}/agristreamweb:${{ github.sha }} .
        docker tag ${{ secrets.AZURE_REGISTRY_SERVER }}/agristreamweb:${{ github.sha }} ${{ secrets.AZURE_REGISTRY_SERVER }}/agristreamweb:latest

    - name: Push Container to Azure
      run: |
        docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/agristreamweb:${{ github.sha }}
        docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/agristreamweb:latest
